name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download and Install AnyDesk
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process -Force
          Write-Host "Baixando o AnyDesk..."
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          
          Write-Host "Instalando o AnyDesk..."
          Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList '--install C:\AnyDesk --start-with-win --silent' -Wait
          
          $env:Path += ";C:\AnyDesk"
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Machine)

      - name: Set Password and Get AnyDesk ID
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          if (Test-Path $anydeskPath) {
              # Define a senha para acesso nao supervisionado (Troque 'SuaSenha123' pela senha que quiser)
              echo "SuaSenha123" | & $anydeskPath --set-password
              
              # Inicia o servico
              Start-Process -FilePath $anydeskPath
              Start-Sleep -Seconds 10
              
              # Pega a ID do AnyDesk e exibe no log
              $anydeskId = cmd /c "C:\AnyDesk\AnyDesk.exe --get-id"
              Write-Host "=========================================="
              Write-Host " ID DO ANYDESK: $anydeskId"
              Write-Host " SENHA: SuaSenha123"
              Write-Host "=========================================="
          } else {
              Write-Host "Erro: Executável não encontrado."
              exit 1
          }

      - name: Monitor AnyDesk Process
        run: |
          $anydeskPath = "C:\AnyDesk\AnyDesk.exe"
          while ($true) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "AnyDesk não está rodando, reiniciando..."
              Start-Process -FilePath $anydeskPath
            }
            Start-Sleep -Seconds 300
          }
